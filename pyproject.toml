[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videodock"
version = "0.6.1"
description = "A persistent desktop video and audio download queue"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "yt-dlp[default]>=2026.3.17", "faster-whisper==1.2.1", "av==16.0.1", "ctranslate2==4.8.2", "onnxruntime==1.30.0", "tokenizers==0.23.2", "numpy==2.5.3", "huggingface-hub==1.33.0", "filelock>=3.20,<4", "sentencepiece==0.2.1", "opencc-python-reimplemented==0.1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "pyinstaller>=6.12"]

[project.gui-scripts]
videodock = "videodock.app:main"

[tool.setuptools.packages.find]
include = ["videodock*"]

[tool.setuptools.package-data]
videodock = ["model_catalog.json", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["vendor", ".test-artifacts", ".venv-inference", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

